name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings.test
      ALLOWED_HOSTS: localhost,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost,http://testserver
      POSTGRES_DB: plataforma_campanha_ci
      POSTGRES_USER: plataforma_ci
      POSTGRES_PASSWORD: plataforma_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      HEALTHCHECK_VERIFY_REDIS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificacoes Django
        run: python manage.py check --settings=config.settings.test

      - name: Verificar migrations
        run: python manage.py makemigrations --check --dry-run --noinput --settings=config.settings.test

      - name: Executar testes
        run: python manage.py test --settings=config.settings.test

      - name: Validar hardening de producao
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DEBUG: "False"
          ALLOWED_HOSTS: app.exemplo.com
          CSRF_TRUSTED_ORIGINS: https://app.exemplo.com
        run: python manage.py check --deploy --settings=config.settings.production
