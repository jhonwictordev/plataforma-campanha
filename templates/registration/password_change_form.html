{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4">
            <h1 class="h4 mb-3">Alterar senha</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Salvar nova senha</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
