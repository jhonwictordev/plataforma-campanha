{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-lg-5">
                <p class="eyebrow mb-1">Conta do usuário</p>
                <h2 class="h3 mb-4">Meu perfil</h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        {% for field in form %}
                            <div class="col-md-6">
                                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <div class="text-danger small">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Atualizar perfil</button>
                        <a class="btn btn-outline-secondary" href="{% url 'password_change' %}">Alterar senha</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
