databases:
  - name: plataforma-campanha-db
    plan: free

services:
  - type: keyvalue
    name: plataforma-campanha-redis
    plan: free
    ipAllowList: []

  - type: web
    name: plataforma-campanha-web
    runtime: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: sh scripts/build.sh
    preDeployCommand: sh scripts/predeploy-demo.sh
    startCommand: sh scripts/start-web.sh
    healthCheckPath: /saude/prontidao/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-campanha-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: plataforma-campanha-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: plataforma-campanha-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: plataforma-campanha-redis
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: HEALTHCHECK_VERIFY_REDIS
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: nao-responda@plataformacampanha.local
      - key: WHATSAPP_OFFICIAL_API_URL
        value: ""
      - key: WHATSAPP_OFFICIAL_API_TOKEN
        sync: false
      - key: WHATSAPP_OFFICIAL_WEBHOOK_TOKEN
        sync: false
      - key: SMS_OFFICIAL_API_URL
        sync: false
      - key: SMS_OFFICIAL_API_TOKEN
        sync: false
      - key: SMS_OFFICIAL_WEBHOOK_TOKEN
        sync: false
      - key: EMAIL_OFFICIAL_WEBHOOK_TOKEN
        sync: false
